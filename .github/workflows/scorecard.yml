name: OpenSSF Scorecard

# Runs the OpenSSF Scorecard analyzer weekly (and on branch-protection changes)
# and publishes the result to the Scorecard.dev badge. This is a public repo, so
# publish_results can be true and no PAT is needed — the default GITHUB_TOKEN
# plus id-token: write is sufficient.

on:
  branch_protection_rule:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — weekly cadence
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # write SARIF to the Security tab
      id-token: write          # OIDC token for publish_results
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 30

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        with:
          sarif_file: results.sarif
