name: Release

# Release lane for the Kadenz Scanner. Fires on an `app-v*` tag (or manual
# dispatch) and ships builds — it does NOT run tests (ci.yml covers that).
#
# How to cut a release:
#   git tag app-v1.17.6 && git push origin app-v1.17.6
#
# Required GitHub secrets (App Store Connect API key, non-interactive):
#   APP_STORE_CONNECT_API_KEY_ID      — the key id     (e.g. ABC123XYZ9)
#   APP_STORE_CONNECT_ISSUER_ID       — the issuer id  (UUID)
#   APP_STORE_CONNECT_API_KEY_BASE64  — base64 of the .p8 private key
#     (generate with: base64 -i AuthKey_XXXX.p8 | pbcopy)
#
# Required GitHub secrets (code signing — the runner is a fresh macOS VM with
# an empty keychain on every run, so there is nothing to codesign with unless
# we import an identity first):
#   IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 — base64 of the exported .p12
#     (Apple Distribution cert + private key, password-protected)
#     (generate with: base64 -i AppleDistribution.p12 | pbcopy)
#   IOS_DISTRIBUTION_CERTIFICATE_PASSWORD   — the password chosen when
#     exporting that .p12 from Keychain Access
#   IOS_PROVISIONING_PROFILE_BASE64         — base64 of the App Store
#     distribution provisioning profile for live.kadenz.kadenzScanner
#     (generate with: base64 -i KadenzScanner_AppStore.mobileprovision | pbcopy)
#
# The App Store Connect API key only authenticates the *upload*
# (fastlane/App Store Connect API). It cannot codesign the archive — Xcode
# needs an actual Apple Distribution certificate + matching provisioning
# profile present locally for that, which is why the two secret groups above
# are both required and distinct.
#
# Optional (Android Play Store, see the `android` job):
#   PLAY_STORE_SERVICE_ACCOUNT_JSON   — Play Console service-account JSON
#
# NOTE: fork PRs never see these secrets (GitHub withholds them from forked
# workflow runs). Releases are cut from tags pushed by a maintainer.
#
# The fastlane scaffolding lives in `_native_overrides/ios/fastlane` and is
# installed into `ios/fastlane` by `./setup.sh`.

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:
    inputs:
      build_number:
        description: "iOS build number override (defaults to the run number)"
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.x
  ORG_ID: live.kadenz

jobs:
  ios-testflight:
    name: iOS — build + upload to TestFlight
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # The runner is a brand-new macOS VM on every run: its keychain has no
      # codesigning identity and ~/Library/MobileDevice/Provisioning Profiles
      # is empty. Without this step, `flutter build ipa` fails immediately
      # with "No valid code signing certificates were found" — this is a
      # separate requirement from the App Store Connect API key used later
      # for the upload itself (that key authenticates the upload, not the
      # codesign step).
      - name: Import Apple Distribution certificate + provisioning profile
        env:
          CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${CERT_BASE64:-}" ] || [ -z "${CERT_PASSWORD:-}" ] || [ -z "${PROFILE_BASE64:-}" ]; then
            echo "::error::iOS code-signing secrets are not all set (IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 / IOS_DISTRIBUTION_CERTIFICATE_PASSWORD / IOS_PROVISIONING_PROFILE_BASE64)" >&2
            exit 1
          fi

          CERT_PATH="${RUNNER_TEMP}/dist_cert.p12"
          PROFILE_PATH="${RUNNER_TEMP}/profile.mobileprovision"
          KEYCHAIN_PATH="${RUNNER_TEMP}/release-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          # Only wipe the decoded cert/profile files here — the keychain itself
          # must stay unlocked and in the search list for the later build step.
          # It is deleted in the "Clean up temporary keychain" step below.
          trap 'rm -f "$CERT_PATH" "$PROFILE_PATH"' EXIT

          printf '%s' "$CERT_BASE64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          # Dedicated keychain, scoped to this job only, so we never touch
          # the runner's default login keychain.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          # Why: intentional word-splitting — each existing keychain path must
          # become its own positional arg to `-s`, matching GitHub's own
          # documented recipe for this step.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          cp "$PROFILE_PATH" "$PROFILES_DIR/"

          echo "Identities available for codesigning after import:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Generate native iOS/Android projects + fastlane overlay
        run: ./setup.sh
        env:
          ORG_ID: ${{ env.ORG_ID }}

      - name: Determine build number
        id: buildno
        run: |
          BN="${{ github.event.inputs.build_number }}"
          if [ -z "$BN" ]; then
            BN="${{ github.run_number }}"
          fi
          echo "build_number=$BN" >> "$GITHUB_OUTPUT"
          echo "Using iOS build number: $BN"

      - name: Build IPA and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          BUILD_NUMBER: ${{ steps.buildno.outputs.build_number }}
        run: |
          set -euo pipefail

          if [ -z "${ASC_KEY_ID:-}" ] || [ -z "${ASC_ISSUER_ID:-}" ] || [ -z "${ASC_KEY_BASE64:-}" ]; then
            echo "::error::App Store Connect API key secrets are not all set" >&2
            exit 1
          fi

          # Decode the .p8 to a temp file and guarantee it is wiped on any exit.
          ASC_KEY_FILEPATH="${RUNNER_TEMP}/asc_api_key.p8"
          export ASC_KEY_FILEPATH
          trap 'rm -f "$ASC_KEY_FILEPATH"' EXIT
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$ASC_KEY_FILEPATH"
          chmod 600 "$ASC_KEY_FILEPATH"

          # AOT-hardened release build (--obfuscate + --split-debug-info +
          # --tree-shake-icons). Symbols are uploaded as an artifact below so
          # crash reports can be de-obfuscated later.
          flutter build ipa \
            --release \
            --obfuscate \
            --split-debug-info=build/symbols/ios \
            --tree-shake-icons \
            --build-number "$BUILD_NUMBER" \
            --dart-define=KADENZ_API=https://kadenz.live \
            --export-options-plist ios/ExportOptions.plist

          IPA_PATH="$(find build/ios/ipa -name '*.ipa' | head -n1)"
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No .ipa produced by flutter build ipa" >&2
            exit 1
          fi
          echo "Uploading IPA: $IPA_PATH"

          # Reuse the fastlane `beta_upload` lane. It calls upload_to_testflight
          # with skip_waiting_for_build_processing: true and authenticates via
          # the ASC_* env vars above. fastlane ships preinstalled on GitHub
          # macOS runners.
          ABS_IPA="$(cd "$(dirname "$IPA_PATH")" && pwd)/$(basename "$IPA_PATH")"
          ( cd ios && fastlane ios beta_upload ipa:"$ABS_IPA" )

      - name: Upload iOS Dart symbols (for crash-report de-obfuscation)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: kadenz-scanner-ios-dart-symbols
          path: build/symbols/ios/
          if-no-files-found: warn
          retention-days: 90

      - name: Clean up temporary keychain
        if: always()
        run: security delete-keychain "${RUNNER_TEMP}/release-signing.keychain-db" 2>/dev/null || true

  android:
    name: Android — build app bundle (artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - run: flutter pub get

      - name: Generate native projects
        run: ./setup.sh
        env:
          ORG_ID: ${{ env.ORG_ID }}

      - name: Build release app bundle (.aab)
        run: |
          flutter build appbundle \
            --release \
            --obfuscate \
            --split-debug-info=build/symbols/android \
            --tree-shake-icons \
            --build-number "${{ github.run_number }}" \
            --dart-define=KADENZ_API=https://kadenz.live

      - name: Upload .aab as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: kadenz-scanner-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android Dart symbols (for crash-report de-obfuscation)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: kadenz-scanner-android-dart-symbols
          path: build/symbols/android/
          if-no-files-found: warn
          retention-days: 90

      # TODO: Play Store upload is not wired yet — needs the app published once
      # manually in the Play Console and a PLAY_STORE_SERVICE_ACCOUNT_JSON
      # secret. Gated on that secret so it stays a no-op until configured.
      - name: Check Play Store upload readiness
        env:
          PLAY_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "${PLAY_JSON:-}" ]; then
            echo "PLAY_STORE_SERVICE_ACCOUNT_JSON not set — skipping Play Store upload (TODO)."
            exit 0
          fi
          echo "Service-account secret present, but Play Store upload is not implemented yet (TODO)."
